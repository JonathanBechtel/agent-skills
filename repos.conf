# Repos whose own .claude/skills should be reachable from this hub.
#
#   <name>=<checkout path>
#
# install.sh creates repos/<name> as a symlink into that checkout's skill
# directory. The real files stay in the repo, tracked and portable — the links
# here are a browsing and editing convenience, and are regenerated per machine
# (repos/ is gitignored; this file is not).
#
# ~ is expanded. Missing checkouts are skipped with a note.

draft-app=~/draft-app
draft-app-agent=~/draft-app-agent
platform-ai=~/platform-ai
pearl-mcp=~/pearl-mcp
